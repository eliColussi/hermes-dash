[project]
name = "staff-room-bridge"
version = "0.1.0"
description = "FastAPI bridge between Staff Room OS dashboard and HERMÉS Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "ruamel.yaml>=0.18.6",
    "pyyaml>=6.0.2",
    "watchfiles>=0.24.0",
    "psutil>=6.1.0",
    "composio>=0.13.0",
    "pynacl>=1.5.0",
    "httpx>=0.27.0",
    # Required by hermes' gateway api_server platform (POST /v1/chat/completions),
    # which our chat router calls instead of spawning a subprocess per message.
    "aiohttp>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
